{% extends 'base.html' %}

{% block title %}Excluir Aviao - SkyBooker{% endblock %}

{% block content %}
<div class="delete-confirm">
    <h2 style="color:var(--sky-danger);font-size:1.3rem;margin-bottom:1rem;">Excluir Aviao</h2>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-sky btn-sky-danger">Confirmar</button>
            <a href="{% url 'aviao-list' %}" class="btn btn-sky btn-sky-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
