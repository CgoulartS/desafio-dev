{% extends 'base.html' %}

{% block title %}Cancelar Reserva - SkyBooker{% endblock %}

{% block content %}
<h2>Cancelar Reserva</h2>
<div class="alert alert-warning">
    Tem certeza que deseja cancelar a reserva de <strong>{{ object.cliente.nome }}</strong>
    no voo <strong>{{ object.voo }}</strong> (Assento {{ object.numero_assento }})?
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar Cancelamento</button>
    <a href="{% url 'reserva-list' %}" class="btn btn-secondary">Voltar</a>
</form>
{% endblock %}
