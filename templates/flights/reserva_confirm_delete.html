{% extends 'base.html' %}
{% block title %}Cancelar Reserva - SkyBooker{% endblock %}
{% block content %}
<div class="delete-confirm">
    <h2 style="color:var(--sky-danger);font-size:1.3rem;margin-bottom:1rem;">Cancelar Reserva</h2>
    <p>Cancelar reserva de <strong>{{ object.cliente.nome }}</strong> no voo <strong>{{ object.voo }}</strong> (Assento {{ object.numero_assento }})?</p>
    <form method="post">{% csrf_token %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-sky btn-sky-danger">Confirmar</button>
            <a href="{% url 'reserva-list' %}" class="btn btn-sky btn-sky-outline">Voltar</a>
        </div>
    </form>
</div>
{% endblock %}
