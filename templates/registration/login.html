{% extends 'base.html' %}

{% block title %}Login - SkyBooker{% endblock %}

{% block content %}
<div class="login-card">
    <div style="text-align:center;font-size:2.5rem;margin-bottom:0.5rem;">&#9992;</div>
    <h2>SkyBooker</h2>
    <p class="login-subtitle">Entre para gerenciar reservas de voos</p>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div class="alert alert-danger">Usuario ou senha invalidos.</div>
        {% endif %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-sky btn-sky-primary w-100">Entrar</button>
    </form>
</div>
{% endblock %}
